<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#006400">
    <title>Santa Letter</title>
    <style>
        :root {
            --green: #006400;
            --green-dark: #0a3f1c;
            --red: #c8102e;
            --red-dark: #a30d25;
            --gold: #f4c542;
            --paper: #fffdf8;
        }

        * { box-sizing: border-box; }

        html { background: var(--green-dark); }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.5;
            text-align: center;
            color: #fff;
            background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
        }

        .wrap {
            width: 100%;
            max-width: 44rem;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        h1 { margin: 0 0 .25rem; font-size: clamp(1.6rem, 5vw, 2.2rem); }
        .lead { margin: 0 0 1.25rem; opacity: .9; }

        .start {
            display: block;
            padding: 1rem;
            color: #1d2b21;
            text-decoration: none;
            background: var(--paper);
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
        }
        .start:hover { box-shadow: 0 0 2em .6em rgba(244, 197, 66, .55); }
        .start:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

        .start img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: .7rem 1.4rem;
            font-weight: 600;
            color: #fff;
            background: var(--red);
            border-radius: 8px;
        }
        .start:hover .btn,
        .start:focus-visible .btn { background: var(--red-dark); }

        @media (max-width: 30rem) {
            .btn { display: block; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Dear Santa,</h1>
        <p class="lead">Write down what you would like for Christmas.</p>

        <a class="start" href="http://34.30.36.38/index.php">
            <picture>
                <source srcset="Santa-claus.webp" type="image/webp">
                <img src="Santa-claus.jpg" alt="Santa" width="810" height="539" decoding="async" fetchpriority="high">
            </picture>
            <span class="btn">Click me to start</span>
        </a>
    </main>
</body>
</html>
